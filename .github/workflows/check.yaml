on:
  issues:
    types: [opened]
jobs:
  messageCheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - if: contains( github.event.issue.body, 'Trans rights are human rights. Sex work is work') != true
        name: Close Issue
        run: echo "${{ github.event.issue.body }}" && gh issue close --repo "${{ github.repository }}" --comment "Auto-closing issue. See CONTRIBUTING.md for reason." "${{github.event.issue.number}}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN  }}
