on:
  issues:
    types: [opened]
jobs:
  messageCheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - if: startsWith(github.event.issue.body, 'Trans rights are human rights. Sex work is work') != 'true'
        name: Close Issue
        run: gh issue close --comment "Auto-closing issue" "1"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
