on:
  issues:
    types: [opened]
jobs:
  messageCheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - if: contains('Trans rights are human rights. Sex work is work', github.event.issue.body) != 'true'
        name: Close Issue
        run: echo "${{ github.event.issue.body }}" && gh issue close --repo "${{ github.repository }}" --comment "Auto-closing issue" "${{github.event.issue.number}}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN  }}
